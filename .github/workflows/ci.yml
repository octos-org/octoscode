name: CI

# The point of this workflow: a clean checkout has NO `.cargo/config.toml`, so
# every job here builds against the `octos-core` rev pinned in Cargo.toml —
# not against a developer's sibling `../octos` checkout, which the gitignored
# `.cargo/config.toml.example` override redirects to locally. Protocol drift
# between the two is the failure mode this catches.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A force-push supersedes the previous run; don't pay for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 2026-09-12: route through the unified entry so the WHOLE test tree
      # inherits PYTHONDONTWRITEBYTECODE=1 (and GNU tool resolution).
      - run: scripts/verify.sh -- cargo fmt --all --check

  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 44-r1: pin agent-spec (evo skeleton tests parse real specs); cache
      # the binary so reruns are fast. A missing binary FAILS the tests
      # rather than skipping.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/agent-spec
          key: agent-spec-1.4.0
      - run: command -v agent-spec >/dev/null 2>&1 || cargo install agent-spec --version 1.4.0 --locked
      # --all-targets covers lib, bins, tests and benches, and compiles
      # everything clippy would — so a separate `cargo check` job would only
      # repeat this work.
      - run: scripts/verify.sh -- cargo test --all-targets
      # --all-targets skips doctests, so run them separately.
      - run: scripts/verify.sh -- cargo test --doc

  # Windows counterpart of `test`: #641 made the suite portable, but until now
  # no runner executed it on Windows — the gap that let octos#2662's
  # Windows-only break leak to main. scripts/verify.sh is a bash/GNU-tooling
  # wrapper (Darwin coreutils resolution), so on Windows cargo runs directly;
  # the suites that need bash/GNU/fcntl are `#![cfg(unix)]`-gated and compile
  # to empty targets here. agent-spec is likewise only consumed by cfg(unix)
  # suites, so no binary install step is needed. Doctests are platform-
  # agnostic and already covered by the ubuntu `test` job; not repeated here.
  test-windows:
    name: test (windows)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Gating, not reporting: the 5 warnings `main` carried are cleared in
      # this same PR, so the baseline is zero and any new one fails the build.
      - run: scripts/verify.sh -- cargo clippy --all-targets -- -D warnings

  # Aggregate gate for the `default-branch-protection` ruleset, whose required
  # status context is literally "CI required" (added to the ruleset on
  # 2026-09-03). Nothing produced that context, so every PR sat on
  # "Expected — waiting for status". This job needs every real job and reports
  # the required status automatically; any failure or cancellation fails it.
  ci-required:
    name: CI required
    if: always()
    needs: [fmt, test, test-windows, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {}
          for name in sorted(needs):
              result = needs[name]["result"]
              print(name + ": " + result)
              if result in ("failure", "cancelled"):
                  bad[name] = result
          if bad:
              print("gate: FAIL -> " + json.dumps(bad))
              sys.exit(1)
          print("gate: all required jobs succeeded (event-gated skips are fine)")
          PY
