name: Octos review trial

# Temporary. Lets Octos review this pull request once, to try the action on
# GitHub before `octos.yml` is on the default branch. To be removed before
# this pull request is merged.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: octos-org/octos/action@442b8984846168bdcaadbc9762bf61524701fa2a
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          provider: deepseek
          model: deepseek-flash
          auto_review: "true"
