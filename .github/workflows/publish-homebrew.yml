name: Publish Homebrew Formula
# The octoscode Homebrew formula lives IN THIS REPO at Formula/octoscode.rb
# (this repo is its own tap -> `brew tap octos-org/octoscode https://github.com/octos-org/octoscode`).
#
# This is a reusable workflow called by release.yml after cargo-dist has
# created the release and uploaded its assets. It is not a dist custom job:
#   - `release: published` would never fire, because dist creates the release
#     with the built-in GITHUB_TOKEN and GitHub suppresses token-created events.
#   - a dist custom publish job cannot get contents:write — dist caps custom-job
#     permissions to id-token/packages and a reusable workflow can't elevate.
# The caller grants `contents: write` and `pull-requests: write`. Manual
# dispatch remains available for a resumable repair of an existing release.
# HOMEBREW_TAP_TOKEN is intentionally used instead of GITHUB_TOKEN: the org
# forbids Actions itself from creating PRs, and token-created PR events would
# otherwise be suppressed instead of running CI.
#
# TWO-CHANNEL scheme (mirrors dist-workspace.toml + release.yml's npm publish):
#   - STABLE tag (no '-'): render Formula/octoscode.rb (class Octoscode) from
#     packaging/homebrew/octoscode.rb — the stable channel, unchanged.
#   - PRERELEASE tag (has a '-', e.g. v0.2.2-rc.15): render the SEPARATE
#     Formula/octoscode-dev.rb (class OctoscodeDev) from
#     packaging/homebrew/octoscode-dev.rb, pointed at the prerelease assets.
# A prerelease NEVER touches the stable Formula/octoscode.rb, so
# `brew install octos-org/octoscode/octoscode` stays STABLE while
# `brew install octos-org/octoscode/octoscode-dev` tracks the latest prerelease.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: 'Bot/PAT token that can push branches and open formula PRs'
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.5)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  homebrew:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Select formula channel (stable vs prerelease)
        id: gate
        run: |
          # A tag with a '-' (e.g. v0.2.2-rc.15) is a prerelease -> render the
          # SEPARATE dev formula; otherwise render the stable formula. Either
          # way we render + commit (no more skipping) so both channels stay live.
          if [[ "$TAG" == *-* ]]; then
            echo "::notice::$TAG is a prerelease — rendering the dev formula (octoscode-dev); stable octoscode is untouched."
            {
              echo "channel=prerelease"
              echo "formula_file=Formula/octoscode-dev.rb"
              echo "template_file=packaging/homebrew/octoscode-dev.rb"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is a stable release — rendering the stable formula (octoscode)."
            {
              echo "channel=stable"
              echo "formula_file=Formula/octoscode.rb"
              echo "template_file=packaging/homebrew/octoscode.rb"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release tarballs for the tag
        run: |
          set -euo pipefail
          mkdir -p artifacts
          triples="aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu"
          # `host` has completed before this reusable workflow starts. Keep a
          # short retry only for GitHub's asset-list eventual consistency.
          for attempt in $(seq 1 12); do
            missing=0
            for triple in $triples; do
              asset="octoscode-${triple}.tar.xz"
              [ -f "artifacts/$asset" ] && continue
              gh release download "$TAG" --repo "${{ github.repository }}" \
                --pattern "$asset" --dir artifacts 2>/dev/null || true
              [ -f "artifacts/$asset" ] || missing=1
            done
            [ "$missing" = 0 ] && break
            echo "attempt $attempt/12: waiting for release assets to become visible..."
            sleep 10
          done
          for triple in $triples; do
            test -f "artifacts/octoscode-${triple}.tar.xz" \
              || { echo "::error::missing octoscode-${triple}.tar.xz after wait (did release.yml fail?)"; exit 1; }
          done
          ls -la artifacts

      - name: Render formula and commit to main
        env:
          # The channel-specific source template and destination formula, chosen
          # by the gate above (stable -> octoscode, prerelease -> octoscode-dev).
          TEMPLATE_FILE: ${{ steps.gate.outputs.template_file }}
          FORMULA_FILE: ${{ steps.gate.outputs.formula_file }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha_darwin_arm=$(sha256sum artifacts/octoscode-aarch64-apple-darwin.tar.xz | awk '{print $1}')
          sha_linux_arm=$(sha256sum artifacts/octoscode-aarch64-unknown-linux-gnu.tar.xz | awk '{print $1}')
          sha_linux_x64=$(sha256sum artifacts/octoscode-x86_64-unknown-linux-gnu.tar.xz | awk '{print $1}')

          mkdir -p Formula
          cp "$TEMPLATE_FILE" "$FORMULA_FILE"
          sed -i "s|__VERSION__|${version}|g" "$FORMULA_FILE"
          sed -i "s|__TAG__|${TAG}|g" "$FORMULA_FILE"
          sed -i "s|__SHA_DARWIN_ARM__|${sha_darwin_arm}|g" "$FORMULA_FILE"
          sed -i "s|__SHA_LINUX_ARM__|${sha_linux_arm}|g" "$FORMULA_FILE"
          sed -i "s|__SHA_LINUX_X64__|${sha_linux_x64}|g" "$FORMULA_FILE"

          echo "----- rendered ${FORMULA_FILE} (${CHANNEL}) -----"
          cat "$FORMULA_FILE"

          # `git diff` reports TRACKED files only, so a formula that has never
          # been committed reads as "unchanged" and this step silently no-ops
          # while still reporting success. That is exactly the prerelease
          # channel: Formula/octoscode-dev.rb has never existed, so every RC
          # tag since the two-channel scheme landed rendered it and threw it
          # away. Stage first and diff the INDEX, which sees an add as a change.
          git add -- "$FORMULA_FILE"
          if git diff --cached --quiet -- "$FORMULA_FILE"; then
            echo "${FORMULA_FILE} unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "octos-release-bot"
          git config user.email "151983+ymote@users.noreply.github.com"
          # `main` requires changes via a PR (ruleset `default-branch-protection`,
          # 0 approvals required) — a direct `git push origin main` is rejected
          # with GH013. Push the formula to a branch and SELF-MERGE a PR: that
          # satisfies the rule with the built-in token and needs no approval.
          #
          # EVERY STEP BELOW IS RESUMABLE. This job used to be unrecoverable
          # once it failed anywhere: it pushed the branch, then died on
          # `gh pr create` (see #474 — "GitHub Actions is not permitted to
          # create or approve pull requests", a repo/org setting). The branch
          # it left behind then turned the retry's `git push -f` into a real
          # force-push, which the `no-push` ruleset rejects with GH013 — so
          # neither `gh run rerun` nor `workflow_dispatch` could ever succeed
          # and the formula had to be merged by hand. Two blockers stacked.
          #
          # So: never force-push, never delete the branch (the same ruleset
          # forbids `deletion`), and treat "already exists" as success at each
          # step. A retry now resumes from wherever the last attempt stopped.
          BRANCH="homebrew/${TAG}-${CHANNEL}"
          FORMULA_BODY="$(cat "$FORMULA_FILE")"

          # Build ON TOP of the remote branch when it exists, so the push is a
          # fast-forward rather than a force. Re-apply the rendered formula
          # after the checkout, since switching branches replaces the file.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          printf '%s\n' "$FORMULA_BODY" > "$FORMULA_FILE"

          git add "$FORMULA_FILE"
          if git diff --cached --quiet -- "$FORMULA_FILE"; then
            echo "branch $BRANCH already carries this formula; skipping commit."
          else
            git commit -m "octoscode ${TAG}: update Homebrew formula (${CHANNEL})"
            git push origin "$BRANCH"
          fi

          # `gh pr create` fails if a PR is already open for this head, and is
          # blocked outright while #474 stands. Neither should abort the job —
          # a PR that already exists is exactly what we want.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "octoscode ${TAG}: update Homebrew formula (${CHANNEL})" \
              --body "Automated Homebrew formula bump for ${TAG} (${CHANNEL} channel)." \
              || echo "::warning::could not open the PR (see #474); branch $BRANCH is pushed and ready to merge by hand"
          fi

          # No --delete-branch: the `no-push` ruleset forbids deletion, and a
          # failure there would mask an otherwise successful merge. Enable
          # auto-merge so the formula PR waits for required CI instead of
          # racing it, then verify that publication actually completed.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr merge "$BRANCH" --squash --auto
            for attempt in $(seq 1 60); do
              state=$(gh pr view "$BRANCH" --json state --jq .state)
              if [ "$state" = "MERGED" ]; then
                echo "Formula PR merged."
                exit 0
              fi
              echo "attempt $attempt/60: waiting for formula PR checks and merge"
              sleep 10
            done
            echo "::error::formula PR did not merge within 10 minutes"
            exit 1
          else
            echo "::error::no PR for $BRANCH — see #474. The branch is pushed; open and merge it by hand."
            exit 1
          fi
