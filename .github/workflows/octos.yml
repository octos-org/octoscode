name: Octos

# Lets maintainers call the Octos agent from this repository's issues and
# pull requests. Read-only for now: Octos answers in a comment and changes
# nothing.
#
# - `@octos <question>` in an issue, a pull request comment or a review
#   comment gets an answer.
# - `@octos watch` on a pull request, or the `octos-watch` label, makes Octos
#   look at failed CI runs and at maintainers' reviews of that pull request.
#   `@octos unwatch` stops it.
#
# Only users with write access can start a run. Needs the repository secret
# `DEEPSEEK_API_KEY`. Docs: https://github.com/octos-org/octos/tree/feat/github-action/action

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read # failed job logs
  contents: read # `write` once the action runs with `access: write`
  issues: write
  pull-requests: write

concurrency:
  group: octos-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  octos:
    # Start a runner only when there is something to do. The action checks
    # again, and it checks that the sender has write access.
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@octos')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@octos')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@octos') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'octos-watch')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The action from octos-org/octos#3300, pinned to its commit. Move the
      # pin to a commit on octos `main` once that pull request is merged.
      - uses: octos-org/octos/action@97b31637f567de8110f0f45707dff4072cad8682
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          provider: deepseek
          model: deepseek-flash
          access: read
