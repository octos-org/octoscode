[package]
name = "octoscode"
version = "0.3.0-rc.8"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/octos-org/octoscode"
homepage = "https://github.com/octos-org/octoscode"
description = "Terminal UI client for the Octos UI Protocol"

[[bin]]
name = "octoscode"
path = "src/main.rs"

# octos-core is the shared protocol crate, owned by the `octos` repo. We depend
# on it by git so a clean checkout (`cargo install --git`, release CI) builds
# without a sibling `../octos`. For live local dev against an uncommitted core,
# add a gitignored `.cargo/config.toml` (see `.cargo/config.toml.example`) that
# patches it to a sibling path — no need to edit this file.
[dependencies]
# Pin the exact commit behind the matching octos release tag recorded in
# `backend_ensure`, so source builds and auto-provisioned binaries share one
# protocol revision.
octos-core = { git = "https://github.com/octos-org/octos", rev = "f049d8704f8239c9eac2d910206f566c7bdda684" }
# Startup splash animation engine (specs/task-startup-splash.spec). Git dep +
# optional local patch, same pattern as octos-core above. ttfx itself only
# depends on clap + terminal_size.
ttfx = { git = "https://github.com/omacom-io/ttfx", rev = "6e24dac78e3011d89bd7ff24d1ad91dd89e11d8a" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
fs2 = "0.4"
libc = "0.2"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
shlex = "1.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
crossterm = "0.28"
# unstable-rendered-line-info: `Paragraph::line_count` drives the measured
# status-bar height (reserve==render for the wrapping status bar).
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
unicode-segmentation = "1"
# Syntax highlighting for fenced code blocks in the transcript. `default-fancy`
# keeps the regex engine pure-Rust (no onig C toolchain), matching the repo's
# no-C-deps convention (see the rustls-only note below).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rust-i18n = "3"
# `update`/`doctor` use a blocking HTTPS client for the GitHub release check.
# Pure-rustls to keep the no-OpenSSL convention.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
semver = "1"
# In-place self-update for the cargo-dist (shell/PowerShell) installer method.
# Optional + default-on via the `update` feature; with the feature OFF, `update`
# still works as a pure advisor (detect method + print command + `--check`).
axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "blocking"], optional = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
rustix = "1.1.4"
# Keep the parent alive while an attached `!` child receives terminal-generated
# Ctrl+C/Ctrl+\\. The child resets caught handlers on exec and retains normal
# shell cancellation semantics. Also used for suspend/resume resilience:
# SIGCONT via the async-signal-safe flag pattern (0.3.18 is already in the
# tree transitively via crossterm/signal-hook-mio).
signal-hook = "0.3.18"

[dev-dependencies]
# Pure-documentation OLP v1 contract tests parse the lane-template TOML block
# in docs/OUTER_LOOP_PROTOCOL.md (tests/olp_contract.rs). toml is already in
# the lockfile transitively; pinning the same line keeps this a zero-delta add.
toml = "0.8"

[features]
default = ["update"]
# Enables axoupdater-backed in-place self-update for cargo-dist installs.
# Distro/package builds can disable it (matches rustup's `no-self-update`).
update = ["dep:axoupdater"]

[lints.rust]
unsafe_code = "deny"

[workspace]
resolver = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Syntax highlighting must stay interactive in DEBUG builds too: the pager
# re-highlights visible history on every scroll frame, and unoptimized
# fancy-regex is 10-50x slower. Optimize just the hot highlight dependencies;
# the workspace's own code keeps fast incremental debug compiles.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.bit-set]
opt-level = 3
[profile.dev.package.bit-vec]
opt-level = 3
